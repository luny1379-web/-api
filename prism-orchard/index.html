<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Prism Orchard</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101322;color:#fff;display:grid;place-items:center;overflow:hidden}canvas{width:min(100vw,46.2085vh);height:min(100vh,216.41vw);touch-action:none;display:block;box-shadow:0 0 80px #193850} </style></head><body><canvas id="c" width="390" height="844" aria-label="Prism Orchard: drag to aim, release to launch"></canvas><script>
'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),W=390,H=844, bottom=733;
const upgrades=[['Twin bloom','Split each launch into two seeds','split'],['Orbit heart','Draw the seed toward nearby fruit','gravity'],['Prism pulse','Bounce energy into adjacent fruit','chain'],['Glass roots','Pierce one fruit per volley','pierce'],['Harvest charm','Double combo harvest bonuses','merge']];
let seed,S,manual=false,last=0,acc=0,pressed=false,mouse={x:.5,y:.73,down:false,tap:false,choice:null},audio;
function rnd(){seed=(seed+0x6D2B79F5)>>>0;let z=seed;z=Math.imul(z^z>>>15,z|1);z^=z+Math.imul(z^z>>>7,z|61);return((z^z>>>14)>>>0)/4294967296}
function tone(freq=440,dur=.07){if(manual||!audio)return;try{const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.value=freq;v.gain.setValueAtTime(.065,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function row(wave,y=170){const out=[];for(let k=0;k<5;k++){if(rnd()<.13)continue;const hp=1+Math.floor(rnd()*Math.min(4,wave))+Math.floor(wave/3);out.push({x:55+k*70,y,hp,max:hp,r:26,kind:Math.floor(rnd()*4),id:S.next++})}return out.length?out:[{x:195,y,hp:1,max:1,r:26,kind:0,id:S.next++}]}
function setup(n){seed=n>>>0;S={wave:1,score:0,combo:0,best:0,phase:'aiming',game_over:false,awaiting_revive:false,revived:false,shots:0,next:0,balls:[],fruits:[],particles:[],float:[],aim:{x:195,y:420},aiming:false,prevDown:false,tick:0,shake:0,freeze:0,levels:{split:0,gravity:0,chain:0,pierce:0,merge:0},cards:[],shield:0};S.fruits=row(1).concat(row(1,237));acc=0;render()}
function launch(x,y){if(S.phase!=='aiming')return;const a=Math.atan2(Math.min(y,bottom-40)-bottom,x-195),speed=560,count=1+Math.min(2,S.levels.split);S.balls=[];for(let i=0;i<count;i++){const angle=a+(i-(count-1)/2)*.14;S.balls.push({x:195,y:bottom,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:9,life:0,pierces:S.levels.pierce,hit:-1,wait:0})}S.phase='flying';S.aiming=false;S.shots++;S.combo=0;tone(350)}
function burst(x,y,k,amount=12){for(let i=0;i<amount;i++){let a=rnd()*Math.PI*2,m=25+rnd()*170;S.particles.push({x,y,vx:Math.cos(a)*m,vy:Math.sin(a)*m,t:.3+rnd()*.4,k})}}
function hit(f,damage=1,chain=true){if(f.hp<=0)return;f.hp-=damage;S.combo++;S.best=Math.max(S.best,S.combo);S.score+=10+Math.min(30,S.combo*2)*(1+S.levels.merge);S.shake=5;S.freeze=2;S.float.push({x:f.x,y:f.y,t:.7,text:'+'+(10+Math.min(30,S.combo*2)*(1+S.levels.merge))});burst(f.x,f.y,f.kind,f.hp<=0?19:7);tone(280+S.combo*42);if(chain&&S.levels.chain){const near=S.fruits.filter(q=>q!==f&&q.hp>0&&Math.hypot(q.x-f.x,q.y-f.y)<95).sort((a,b)=>a.id-b.id);if(near.length)hit(near[0],1,false)}if(f.hp<=0){S.score+=20; if(S.combo%3===0){const b=S.balls[0];if(b)b.r=Math.min(16,b.r+1)}}}
function draft(){S.phase='draft';S.cards=[];const pool=upgrades.slice();while(S.cards.length<3)S.cards.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);tone(700,.15)}
function choose(i){if(S.phase!=='draft'||!Number.isInteger(i)||i<0||i>=3)return;S.levels[S.cards[i][2]]++;S.wave++;S.shots=0;S.fruits=row(S.wave).concat(row(S.wave,237));if(S.wave>=4)S.fruits.push(...row(S.wave,304));S.phase='aiming';S.combo=0;S.cards=[];S.aiming=false}
function fail(){if(!S.revived){S.phase='revive';S.awaiting_revive=true}else{S.phase='over';S.game_over=true;S.awaiting_revive=false}S.balls=[]}
function revive(){if(S.phase!=='revive')return;S.revived=true;S.awaiting_revive=false;S.phase='aiming';S.shield=2;S.shots=0;S.fruits=S.fruits.filter(f=>f.y<530);for(const f of S.fruits)f.y=Math.max(150,f.y-140);if(!S.fruits.length)S.fruits=row(S.wave);tone(580,.2)}
function endVolley(){S.balls=[];S.fruits=S.fruits.filter(f=>f.hp>0);if(!S.fruits.length){draft();return}if(S.shield>0)S.shield--;else for(const f of S.fruits)f.y+=Math.min(47,25+S.wave*3);if(S.wave>=4&&S.shots%5===0&&S.fruits.length>4)S.fruits.push(...row(S.wave,151));if(S.fruits.some(f=>f.y+f.r>=bottom-45))fail();else S.phase='aiming'}
function input(o){const x=Math.max(9,Math.min(381,(Number(o.x)||.5)*W)),y=Math.max(100,Math.min(bottom-40,(Number(o.y)||.5)*H)),down=!!o.down,tap=!!o.tap;
if(S.phase==='draft'&&tap&&Number.isInteger(o.choice)){choose(o.choice);S.prevDown=down;return}if(S.phase==='revive'&&tap){revive();S.prevDown=down;return}if(S.phase==='over'&&tap){setup(42);return}if(S.phase==='aiming'){if(down){S.aim={x,y};S.aiming=true}if((S.prevDown&&!down&&S.aiming)||tap){launch(S.aiming?S.aim.x:x,S.aiming?S.aim.y:y)}}S.prevDown=down}
function physics(dt){S.tick++;S.shake*=.83;for(const p of S.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=75*dt;p.t-=dt}S.particles=S.particles.filter(p=>p.t>0);for(const f of S.float){f.y-=35*dt;f.t-=dt}S.float=S.float.filter(f=>f.t>0);if(S.freeze>0){S.freeze--;return}if(S.phase!=='flying')return;
for(const b of S.balls){b.life+=dt;b.wait=Math.max(0,b.wait-dt);if(S.levels.gravity){let best=null,d=180;for(const f of S.fruits){const v=Math.hypot(f.x-b.x,f.y-b.y);if(f.hp>0&&v<d){best=f;d=v}}if(best&&d>1){b.vx+=(best.x-b.x)/d*65*S.levels.gravity*dt;b.vy+=(best.y-b.y)/d*65*S.levels.gravity*dt}}
b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<117+b.r){b.y=117+b.r;b.vy=Math.abs(b.vy)}
for(const f of S.fruits){if(f.hp<=0)continue;const dx=b.x-f.x,dy=b.y-f.y,d=Math.hypot(dx,dy),rr=b.r+f.r;if(d<rr&&!(b.hit===f.id&&b.wait>0)){hit(f);b.hit=f.id;b.wait=.09;if(b.pierces>0){b.pierces--;continue}const nx=d>.01?dx/d:0,ny=d>.01?dy/d:-1,dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}b.x=f.x+nx*(rr+.2);b.y=f.y+ny*(rr+.2)}}
}S.fruits=S.fruits.filter(f=>f.hp>0);S.balls=S.balls.filter(b=>b.y<H+25&&b.life<8);if(!S.fruits.length){S.balls=[];draft()}else if(!S.balls.length)endVolley()}
const colors=['#ffb38b','#ffe184','#82ecba','#c4a4ff'];function label(s,x,y,size=12,color='#a7c3d3',align='left',weight=500){g.font=`${weight} ${size}px system-ui,sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;g.fillText(s,x,y)}function round(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.stroke()}}
function render(){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#14283b');bg.addColorStop(.55,'#102034');bg.addColorStop(1,'#070f21');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<46;i++){let x=(i*97+13)%390,y=(i*61+41)%844;g.fillStyle=i%7?'#a4cde61c':'#dbf5ff55';g.fillRect(x,y,i%7?1:2,i%7?1:2)}
label('PRISM ORCHARD',18,25,13,'#b6ffde','left',800);label('WAVE '+String(S.wave).padStart(2,'0'),372,25,13,'#e5ffe7','right',800);label(String(S.score).padStart(6,'0'),18,65,28,'#fff','left',800);label('HARVEST',18,91,10,'#799eae');label('COMBO ×'+S.combo,372,63,16,'#ffe49d','right',800);label('BEST ×'+S.best,372,91,10,'#9ebcc9','right');g.strokeStyle='#294a59';g.beginPath();g.moveTo(16,112);g.lineTo(374,112);g.stroke();
g.save();g.translate(Math.sin(S.tick*2)*S.shake,Math.cos(S.tick*1.7)*S.shake);for(let y=145;y<695;y+=47){g.strokeStyle='#b4e9d50c';g.beginPath();g.moveTo(12,y);g.lineTo(378,y);g.stroke()}
for(const f of S.fruits){const color=colors[f.kind],r=f.r;g.save();g.translate(f.x,f.y);g.shadowColor=color;g.shadowBlur=12;g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/2;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fillStyle='#20384b';g.fill();g.strokeStyle=color;g.lineWidth=2;g.stroke();g.shadowBlur=0;g.fillStyle=color+'33';g.beginPath();g.moveTo(0,-r+3);g.lineTo(r*.82,0);g.lineTo(0,0);g.closePath();g.fill();label(String(f.hp),0,0,23,color,'center',850);g.restore()}
if(S.phase==='aiming'){let a=Math.atan2(S.aim.y-bottom,S.aim.x-195),x=195,y=bottom,vx=Math.cos(a),vy=Math.sin(a);for(let i=0;i<36;i++){x+=vx*14;y+=vy*14;if(x<9||x>381){vx=-vx;x=Math.max(9,Math.min(381,x))}if(y<130)break;g.globalAlpha=.9-i*.02;g.fillStyle='#b9ffe0';g.beginPath();g.arc(x,y,Math.max(1,3-i*.05),0,Math.PI*2);g.fill()}g.globalAlpha=1;g.shadowColor='#80f9c4';g.shadowBlur=18;g.fillStyle='#e5ffe8';g.beginPath();g.arc(195,bottom,12,0,Math.PI*2);g.fill();g.shadowBlur=0}
for(const b of S.balls){g.shadowColor='#96fbe3';g.shadowBlur=20;g.fillStyle='#f3ffe3';g.beginPath();g.arc(b.x,b.y,b.r,0,2*Math.PI);g.fill();g.shadowBlur=0}for(const p of S.particles){g.globalAlpha=Math.min(1,p.t*3);g.fillStyle=colors[p.k];g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;for(const f of S.float)label(f.text,f.x,f.y,13,'#fff6bd','center',800);g.restore();
g.strokeStyle='#e4bc7d77';g.setLineDash([6,5]);g.beginPath();g.moveTo(10,bottom-45);g.lineTo(380,bottom-45);g.stroke();g.setLineDash([]);label('ORCHARD EDGE',195,bottom-58,9,'#a48d80','center');round(14,776,362,52,15,'#182d3b','#335766');label(S.phase==='aiming'?'DRAG TO AIM  ·  RELEASE TO BLOOM':S.phase==='flying'?'HARVEST IN MOTION':S.phase==='draft'?'CHOOSE YOUR NEXT BLOOM':'ONE MORE HARVEST?',195,795,11,'#d6f2df','center',750);label('VOLLEY '+S.shots+'  ·  '+(S.revived?'CONTINUE USED':'1 CONTINUE READY')+(S.shield?'  ·  SHIELD '+S.shield:''),195,812,10,'#90b3bb','center');
if(['draft','revive','over'].includes(S.phase)){g.fillStyle='#071020db';g.fillRect(0,0,W,H);label(S.phase==='draft'?'THE ORCHARD GROWS':S.phase==='revive'?'LAST CHANCE':'HARVEST COMPLETE',195,250,23,'#f0ffe2','center',850);label(S.phase==='draft'?'Choose a new botanical power':S.phase==='revive'?'Clear the edge and gain two shields':'Final score: '+S.score,195,283,13,'#b6cbd2','center');if(S.phase==='draft'){S.cards.forEach((u,i)=>{const y=325+i*88;round(28,y,334,72,12,'#1c3845','#78c8ab');label(String(i+1).padStart(2,'0'),49,y+24,12,'#99d5b4');label(u[0],82,y+24,19,'#e7ffdc','left',800);label(u[1],82,y+48,11,'#b6d1d1')})}else{round(38,340,314,68,18,'#a5ebbb');label(S.phase==='revive'?'CONTINUE':'PLAY AGAIN',195,374,19,'#10252b','center',850)}}}
function step(ms,o={}){input(o);acc+=Math.max(0,Math.min(100,Number(ms)||0));while(acc>=1000/120){physics(1/120);acc-=1000/120}render()}
function state(){return {phase:S.phase,wave:S.wave,score:S.score,entities:S.fruits.map(f=>({id:f.id,x:f.x,y:f.y,hp:f.hp})).concat(S.balls.map(b=>({x:+b.x.toFixed(3),y:+b.y.toFixed(3),r:b.r}))),combo:S.combo,game_over:S.game_over,awaiting_revive:S.awaiting_revive,upgrades:{...S.levels},shots:S.shots}}
window.__GAME={reset(n){manual=true;setup(n)},step,state};setup(42);
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}c.addEventListener('pointerdown',e=>{if(manual)return;try{audio??=new AudioContext();audio.resume()}catch{}c.setPointerCapture(e.pointerId);mouse={...point(e),down:true,tap:false,choice:null};pressed=true});c.addEventListener('pointermove',e=>{if(pressed)mouse={...mouse,...point(e)}});c.addEventListener('pointerup',e=>{if(manual)return;const p=point(e),y=p.y*H;mouse={...p,down:false,tap:true,choice:S.phase==='draft'?Math.floor((y-325)/88):null};pressed=false});c.addEventListener('pointercancel',()=>{pressed=false;mouse.down=false});function frame(t){if(!manual){step(last?Math.min(50,t-last):16.67,mouse);mouse.tap=false}last=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
